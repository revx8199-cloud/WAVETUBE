<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Super Plumber Bros</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  #wrap {
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }
  canvas {
    display:block;
    background:linear-gradient(#5c94fc, #a8d8ff);
    image-rendering: pixelated;
    width:100%;
    height:100%;
  }

  .screen {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    background:
      radial-gradient(circle at 20% 20%, #7ec8ff 0%, transparent 40%),
      linear-gradient(#3a6ee8, #123a99 60%, #041333);
    color:#fff;
    text-align:center;
    z-index:10;
  }
  .hidden { display:none !important; }

  .title {
    font-size:min(9vw, 56px);
    font-weight:900;
    letter-spacing:2px;
    color:#ffd23f;
    text-shadow:
      4px 4px 0 #c0392b,
      -2px -2px 0 #7a1f0f,
      6px 6px 0 rgba(0,0,0,.4);
    font-family: 'Impact', 'Arial Black', sans-serif;
    transform: skew(-3deg);
  }
  .subtitle {
    font-size:14px;
    color:#ffe9a8;
    letter-spacing:4px;
    margin-top:-8px;
  }

  .menu-btn {
    width:240px;
    padding:14px 0;
    font-size:20px;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(#e74c3c,#c0392b);
    border:4px solid #7a1f0f;
    border-radius:8px;
    cursor:pointer;
    letter-spacing:2px;
    box-shadow:0 6px 0 #7a1f0f, 0 8px 10px rgba(0,0,0,.4);
    transition: transform .08s ease;
    font-family:inherit;
  }
  .menu-btn:hover { filter:brightness(1.15); }
  .menu-btn:active { transform:translateY(6px); box-shadow:0 0 0 #7a1f0f; }
  .menu-btn.blue { background:linear-gradient(#3498db,#1f618d); border-color:#123a5c; box-shadow:0 6px 0 #123a5c,0 8px 10px rgba(0,0,0,.4); }
  .menu-btn.blue:active { box-shadow:0 0 0 #123a5c; }
  .menu-btn.green { background:linear-gradient(#2ecc71,#1e8449); border-color:#0e4a26; box-shadow:0 6px 0 #0e4a26,0 8px 10px rgba(0,0,0,.4); }
  .menu-btn.green:active { box-shadow:0 0 0 #0e4a26; }
  .menu-btn.purple { background:linear-gradient(#9b59b6,#5e3370); border-color:#3a1f47; box-shadow:0 6px 0 #3a1f47,0 8px 10px rgba(0,0,0,.4); }
  .menu-btn.purple:active { box-shadow:0 0 0 #3a1f47; }
  .menu-btn.small { width:auto; padding:10px 22px; font-size:15px; }

  .coin-tally {
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(0,0,0,.35);
    padding:8px 14px;
    border-radius:20px;
    font-weight:bold;
    font-size:16px;
    color:#ffd23f;
  }
  .coin-icon {
    width:18px; height:18px;
    background:radial-gradient(circle at 35% 30%, #fff6c9, #ffd23f 40%, #c8860a 100%);
    border-radius:50%;
    border:2px solid #8a5a00;
    flex-shrink:0;
  }

  /* SHOP */
  .shop-layout {
    display:flex;
    gap:24px;
    align-items:flex-start;
    justify-content:center;
  }
  .shop-preview {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    background:rgba(0,0,0,.25);
    border:3px solid rgba(255,255,255,.25);
    border-radius:12px;
    padding:14px 18px;
  }
  #previewCanvas {
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.12), transparent 70%);
    border-radius:8px;
  }
  .preview-name {
    font-weight:bold;
    font-size:15px;
    color:#ffd23f;
  }
  .shop-grid {
    display:grid;
    grid-template-columns:repeat(3, 150px);
    gap:16px;
    margin:10px 0;
    max-height:44vh;
    overflow-y:auto;
  }
  .skin-card {
    background:rgba(255,255,255,.08);
    border:3px solid rgba(255,255,255,.25);
    border-radius:10px;
    padding:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .skin-card.selected { border-color:#ffd23f; box-shadow:0 0 12px #ffd23f; }
  .skin-card.previewed { border-color:#7fd6ff; box-shadow:0 0 10px rgba(127,214,255,.6); }
  .skin-card.locked { opacity:.55; }
  #btnBuyEquip:disabled { opacity:.5; cursor:not-allowed; filter:grayscale(.4); }
  .settings-panel {
    display:flex;
    flex-direction:column;
    gap:16px;
    background:rgba(0,0,0,.3);
    border:2px solid rgba(255,255,255,.2);
    border-radius:14px;
    padding:20px 28px;
    min-width:320px;
  }
  .settings-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    color:#fff;
    font-weight:bold;
    font-size:15px;
  }
  .volume-slider {
    flex:1;
    accent-color:#ffd23f;
    height:6px;
  }
  #volumeValue { min-width:38px; text-align:right; font-size:13px; color:#ffe27a; }
  .skin-name { font-size:13px; font-weight:bold; }
  .skin-price { font-size:12px; color:#ffd23f; }
  .skin-thumb { width:64px; height:82px; }
  .buy-tag {
    font-size:11px;
    background:#2ecc71;
    padding:2px 8px;
    border-radius:10px;
    color:#053;
    font-weight:bold;
  }

  /* LEVEL SELECT */
  .level-grid {
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:600px;
  }
  .level-card {
    width:120px;
    height:90px;
    background:rgba(255,255,255,.1);
    border:3px solid rgba(255,255,255,.3);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-weight:bold;
  }
  .level-card.locked { opacity:.4; cursor:not-allowed; }
  .level-card span.num { font-size:26px; color:#ffd23f; }
  .level-card span.lbl { font-size:11px; color:#cfe3ff; }

  #hud {
    position:absolute;
    top:14px; left:14px;
    color:#fff;
    font-weight:bold;
    font-size:17px;
    text-shadow:2px 2px 0 #000;
    display:flex;
    gap:14px;
    z-index:5;
  }
  .hud-pill {
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(0,0,0,.45);
    border:2px solid rgba(255,255,255,.25);
    padding:6px 14px 6px 8px;
    border-radius:24px;
    backdrop-filter:blur(2px);
  }
  .hud-coin-icon {
    width:26px; height:26px;
    border-radius:50%;
    position:relative;
    background:
      radial-gradient(circle at 32% 28%, #fffbe0 0%, #ffe27a 22%, #ffc93f 48%, #d68e0f 78%, #8a5a00 100%);
    border:2px solid #8a5a00;
    box-shadow:inset 0 -3px 4px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.6);
  }
  .hud-coin-icon::after {
    content:"$";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    color:#8a5a00;
    font-family:'Arial Black', sans-serif;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  .hud-heart-icon { font-size:20px; filter:drop-shadow(1px 2px 0 #000); }
  #hudCoins, #hudLives { font-size:20px; }
  .coin-pop {
    position:absolute;
    font-weight:900;
    color:#ffe27a;
    text-shadow:2px 2px 0 #000;
    font-size:20px;
    pointer-events:none;
    z-index:20;
    animation: coinPop .7s ease-out forwards;
  }
  @keyframes coinPop {
    0%   { transform:translateY(0); opacity:1; }
    100% { transform:translateY(-38px); opacity:0; }
  }
  #pauseBtn, #fsBtn, #muteBtn {
    position:absolute;
    top:10px;
    z-index:5;
    background:rgba(0,0,0,.4);
    border:2px solid #fff;
    color:#fff;
    border-radius:6px;
    padding:4px 10px;
    cursor:pointer;
    font-weight:bold;
  }
  #pauseBtn { right:10px; }
  #fsBtn { right:100px; }
  #muteBtn { right:270px; }
  .msg-banner {
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:min(6vw, 40px);
    font-weight:900;
    color:#ffd23f;
    text-shadow:3px 3px 0 #000;
    z-index:6;
    text-align:center;
    white-space:pre-line;
  }
  .small-note {
    font-size:12px;
    color:#cfe3ff;
    max-width:420px;
  }
  .auth-box {
    margin-top:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .auth-note {
    font-size:12px;
    color:#cfe3ff;
    background:rgba(0,0,0,.3);
    padding:6px 12px;
    border-radius:10px;
  }
  .auth-logged-pill {
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(#2ecc71,#1e8449);
    border:2px solid #0e4a26;
    padding:6px 14px 6px 6px;
    border-radius:24px;
    font-size:13px;
    font-weight:bold;
    color:#fff;
    box-shadow:0 3px 0 #0e4a26;
  }
  .auth-avatar {
    width:24px; height:24px;
    border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    color:#1e8449;
    overflow:hidden;
    flex-shrink:0;
  }
  .auth-avatar img { width:100%; height:100%; object-fit:cover; }
  .global-auth-badge {
    position:absolute;
    top:12px; right:12px;
    z-index:30;
    pointer-events:none;
  }
  .global-auth-badge .auth-logged-pill { pointer-events:auto; font-size:12px; padding:4px 10px 4px 4px; }

  .leaderboard-panel {
    position:absolute;
    top:12px; left:12px;
    z-index:30;
    background:rgba(10,10,25,.55);
    border:2px solid rgba(255,255,255,.25);
    border-radius:12px;
    padding:10px 14px;
    min-width:190px;
    backdrop-filter:blur(2px);
    color:#fff;
  }
  .lb-title {
    font-weight:900;
    font-size:13px;
    color:#ffd23f;
    margin-bottom:6px;
    letter-spacing:1px;
  }
  .lb-row {
    display:grid;
    grid-template-columns:18px 1fr auto auto;
    gap:6px;
    align-items:center;
    font-size:12px;
    padding:2px 0;
    white-space:nowrap;
  }
  .lb-row.me { color:#ffd23f; font-weight:bold; }
  .lb-rank { opacity:.7; }
  .lb-name { overflow:hidden; text-overflow:ellipsis; max-width:70px; }
  .lb-coins { color:#ffe27a; }
  .lb-time { opacity:.75; }
  .lb-empty { font-size:11px; color:#cfe3ff; opacity:.7; }
</style>
</head>
<body>
<div id="wrap">
  <div id="globalAuthBadge" class="global-auth-badge"></div>
  <div id="leaderboardBox" class="leaderboard-panel"></div>

  <!-- MENU -->
  <div id="menuScreen" class="screen">
    <div class="title">SUPER PLUMBER BROS</div>
    <div class="subtitle">ZBIERAJ MONETY • SKACZ • WYGRYWAJ</div>
    <div class="coin-tally"><div class="coin-icon"></div><span id="menuCoins">0</span></div>
    <button class="menu-btn" id="btnPlay">▶ GRAJ</button>
    <button class="menu-btn purple" id="btnLevels">🗺 POZIOMY</button>
    <button class="menu-btn blue" id="btnShop">🛒 SKLEP</button>
    <button class="menu-btn green" id="btnExit">✖ WYJŚCIE</button>
    <button class="menu-btn small" id="btnSettings" style="margin-top:-4px;">⚙ USTAWIENIA</button>
    <div id="authBox" class="auth-box"></div>
  </div>

  <!-- SETTINGS -->
  <div id="settingsScreen" class="screen hidden">
    <div class="title" style="font-size:36px;">USTAWIENIA</div>
    <div class="settings-panel">
      <div class="settings-row">
        <span>Muzyka</span>
        <button class="menu-btn small" id="btnMuteMenu">🔊 WŁĄCZONA</button>
      </div>
      <div class="settings-row">
        <span>Głośność</span>
        <input type="range" id="volumeSlider" min="0" max="100" value="56" class="volume-slider">
        <span id="volumeValue">56%</span>
      </div>
    </div>
    <button class="menu-btn small" id="btnSettingsBack">⬅ POWRÓT</button>
  </div>

  <!-- LEVEL SELECT -->
  <div id="levelScreen" class="screen hidden">
    <div class="title" style="font-size:34px;">WYBIERZ POZIOM</div>
    <div class="level-grid" id="levelGrid"></div>
    <button class="menu-btn small" id="btnLevelsBack">⬅ POWRÓT</button>
  </div>

  <!-- SHOP -->
  <div id="shopScreen" class="screen hidden">
    <div class="title" style="font-size:36px;">SKLEP ZE SKÓRKAMI</div>
    <div class="coin-tally"><div class="coin-icon"></div><span id="shopCoins">0</span></div>
    <div class="shop-layout">
      <div class="shop-grid" id="shopGrid"></div>
      <div class="shop-preview">
        <canvas id="previewCanvas" width="180" height="240"></canvas>
        <div class="preview-name" id="previewName">Klasyczny</div>
        <button class="menu-btn small" id="btnRotate">🔄 OBRÓĆ</button>
        <button class="menu-btn" id="btnBuyEquip">✅ ZAŁÓŻ</button>
      </div>
    </div>
    <button class="menu-btn small" id="btnBack">⬅ POWRÓT</button>
  </div>

  <!-- GAME -->
  <div id="gameScreen" class="hidden">
    <div id="hud">
      <div class="hud-pill"><div class="hud-coin-icon"></div><span id="hudCoins">0</span></div>
      <div class="hud-pill"><span class="hud-heart-icon">❤</span><span id="hudLives">3</span></div>
      <div class="hud-pill">Poziom <span id="hudLevel">1</span></div>
    </div>
    <button id="fsBtn">⛶ PEŁNY EKRAN</button>
    <button id="muteBtn" style="left:auto;">🔊</button>
    <button id="pauseBtn">MENU</button>
    <canvas id="game"></canvas>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ---------- SUPABASE (konta Google + zapis postepu) ----------
  // 1. Zaloz darmowy projekt na https://supabase.com
  // 2. Wklej ponizej swoj Project URL i "anon public" key (Settings -> API)
  // 3. Wlacz logowanie Google: Authentication -> Providers -> Google
  // 4. Ustaw Site URL / Redirect URL na adres, pod ktorym hostujesz ten plik (Netlify/Vercel/GitHub Pages)
  // 5. Odpal ponizszy SQL w Supabase -> SQL Editor (tabela + zabezpieczenia RLS):
  //
  //   create table public.profiles (
  //     id uuid references auth.users on delete cascade primary key,
  //     wallet integer default 0,
  //     owned_skins jsonb default '["classic"]'::jsonb,
  //     equipped_skin text default 'classic',
  //     unlocked_level integer default 0,
  //     updated_at timestamptz default now()
  //   );
  //   alter table public.profiles enable row level security;
  //   create policy "select own" on public.profiles for select using (auth.uid() = id);
  //   create policy "update own" on public.profiles for update using (auth.uid() = id);
  //   create policy "insert own" on public.profiles for insert with check (auth.uid() = id);
  //
  const SUPABASE_URL = 'https://fbijztkbisfdtodfwudo.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_16EaCUKwWvnbl4OGXmIH2Q_EVlgIsGD';
  const supabaseReady = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
  const sb = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let currentUser = null;
  let saveTimer = null;

  // ---------- STATE ----------
  const state = {
    wallet: 0,
    ownedSkins: ['classic'],
    equippedSkin: 'classic',
    unlockedLevel: 0, // index najwyzszego odblokowanego poziomu
    playtimeSeconds: 0,
    displayName: '',
  };

  function nameFromUser(user){
    return (user.user_metadata && user.user_metadata.full_name) || (user.email ? user.email.split('@')[0] : 'Gracz');
  }

  async function loadProfile(user){
    state.displayName = nameFromUser(user);
    const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
    if(error && error.code === 'PGRST116'){
      // brak profilu - tworzymy nowy z domyslnymi wartosciami
      await sb.from('profiles').insert({ id: user.id, display_name: state.displayName });
      return;
    }
    if(data){
      state.wallet = data.wallet ?? 0;
      state.ownedSkins = data.owned_skins ?? ['classic'];
      state.equippedSkin = data.equipped_skin ?? 'classic';
      state.unlockedLevel = data.unlocked_level ?? 0;
      state.playtimeSeconds = data.playtime_seconds ?? 0;
      if(data.display_name) state.displayName = data.display_name;
      else await sb.from('profiles').update({ display_name: state.displayName }).eq('id', user.id);
    }
  }

  function saveProfile(){
    if(!sb || !currentUser) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      await sb.from('profiles').upsert({
        id: currentUser.id,
        wallet: state.wallet,
        owned_skins: state.ownedSkins,
        equipped_skin: state.equippedSkin,
        unlocked_level: state.unlockedLevel,
        playtime_seconds: state.playtimeSeconds,
        display_name: state.displayName,
        updated_at: new Date().toISOString(),
      });
      refreshLeaderboard();
    }, 500);
  }

  async function signInWithGoogle(){
    if(!sb) return;
    await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });
  }
  async function signOut(){
    if(!sb) return;
    await sb.auth.signOut();
    currentUser = null;
    state.wallet = 0; state.ownedSkins = ['classic']; state.equippedSkin = 'classic'; state.unlockedLevel = 0;
    updateAuthUI();
    showScreen('menu');
  }

  function avatarHtml(){
    const url = currentUser && currentUser.user_metadata && currentUser.user_metadata.avatar_url;
    const letter = (currentUser && currentUser.email ? currentUser.email[0] : '?').toUpperCase();
    return url
      ? `<img src="${url}" alt="">`
      : letter;
  }

  function updateAuthUI(){
    const box = document.getElementById('authBox');
    const corner = document.getElementById('globalAuthBadge');
    if(!supabaseReady){
      if(box) box.innerHTML = '<div class="auth-note">Konta Google: nieskonfigurowane (uzupelnij SUPABASE_URL / KEY w kodzie)</div>';
      if(corner) corner.innerHTML = '';
      return;
    }
    if(currentUser){
      const name = currentUser.user_metadata?.full_name || currentUser.email;
      if(box){
        box.innerHTML = `
          <div class="auth-logged-pill">
            <div class="auth-avatar">${avatarHtml()}</div>
            ✅ Zalogowano: ${name}
          </div>
          <button class="menu-btn small" id="btnLogout">🚪 WYLOGUJ</button>`;
        document.getElementById('btnLogout').onclick = signOut;
      }
      if(corner){
        corner.innerHTML = `<div class="auth-logged-pill"><div class="auth-avatar">${avatarHtml()}</div>✅ ${name}</div>`;
      }
    } else {
      if(box){
        box.innerHTML = '<button class="menu-btn small" id="btnLogin">🔵 ZALOGUJ PRZEZ GOOGLE</button>';
        document.getElementById('btnLogin').onclick = signInWithGoogle;
      }
      if(corner) corner.innerHTML = '';
    }
  }

  const SKINS = [
    { id:'classic', name:'Klasyczny', price:0,  colors:{hat:'#d13b2b', shirt:'#d13b2b', overalls:'#274bc4', skin:'#f6b17a'} },
    { id:'luigi',   name:'Zielony Sanitariusz', price:15, colors:{hat:'#2e9e4a', shirt:'#2e9e4a', overalls:'#274bc4', skin:'#f6b17a'} },
    { id:'wario',   name:'Chciwiec', price:25, colors:{hat:'#e4c02e', shirt:'#e4c02e', overalls:'#6a2ea0', skin:'#f6b17a'} },
    { id:'fire',    name:'Ognisty', price:35, colors:{hat:'#f4f4f4', shirt:'#f4f4f4', overalls:'#d13b2b', skin:'#f6b17a'} },
    { id:'ice',     name:'Lodowy', price:40, colors:{hat:'#bfe9ff', shirt:'#bfe9ff', overalls:'#2e86c9', skin:'#f6b17a'} },
    { id:'ninja',   name:'Ninja', price:45, colors:{hat:'#1a1a2e', shirt:'#1a1a2e', overalls:'#3a1030', skin:'#e0a86e'} },
    { id:'pirate',  name:'Pirat', price:55, colors:{hat:'#3a2a1a', shirt:'#4a4a4a', overalls:'#7a1414', skin:'#e0a86e'} },
    { id:'shadow',  name:'Cień', price:50, colors:{hat:'#2b2b2b', shirt:'#2b2b2b', overalls:'#111111', skin:'#c98f5e'} },
    { id:'robot',   name:'Robot', price:60, colors:{hat:'#9aa5b1', shirt:'#c7d0d8', overalls:'#5a6570', skin:'#d8dee3'} },
    { id:'zombie',  name:'Zombie', price:60, colors:{hat:'#4a5a2e', shirt:'#5a6e34', overalls:'#2e3a1a', skin:'#7ba05b'} },
    { id:'royal',   name:'Królewski', price:70, colors:{hat:'#5b2e9e', shirt:'#5b2e9e', overalls:'#2a1050', skin:'#f6b17a'} },

  // ---------- AUDIO (wlasna, syntezowana muzyka - bez zadnych cudzych nagran) ----------
  const AudioEngine = (function(){
    let ctx, masterGain;
    let musicOn = true;
    let melodyTimer = null;
    let melodyIndex = 0;
    let volume = 0.28; // 0..0.5 (glosnosc bazowa)

    // prosta, oryginalna melodyjka w stylu chiptune (nuty w Hz, dlugosc w sek; 0 = pauza)
    const MELODY = [
      [523,0.2],[0,0.05],[523,0.2],[0,0.05],[659,0.2],[0,0.05],[523,0.2],[0,0.05],
      [784,0.4],[0,0.15],[698,0.4],[0,0.15],
      [659,0.2],[0,0.05],[587,0.2],[0,0.05],[523,0.4],[0,0.2],
      [440,0.2],[0,0.05],[523,0.2],[0,0.05],[587,0.4],[0,0.3],
    ];

    function ensureCtx(){
      if(!ctx){
        ctx = new (window.AudioContext||window.webkitAudioContext)();
        masterGain = ctx.createGain();
        masterGain.gain.value = volume;
        masterGain.connect(ctx.destination);
      }
      if(ctx.state === 'suspended') ctx.resume();
    }

    function tone(freq, delay, dur, type, vol){
      if(!ctx || freq<=0) return;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      o.connect(g); g.connect(masterGain);
      const t0 = ctx.currentTime + delay;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime((vol!==undefined?vol:0.4), t0+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.start(t0);
      o.stop(t0+dur+0.02);
    }

    function scheduleMusic(){
      if(!musicOn) return;
      ensureCtx();
      clearTimeout(melodyTimer);
      function step(){
        if(!musicOn) return;
        const [freq,dur] = MELODY[melodyIndex % MELODY.length];
        if(freq>0) tone(freq, 0, dur*0.85, 'triangle', 0.22);
        melodyIndex++;
        melodyTimer = setTimeout(step, dur*1000);
      }
      step();
    }
    function stopMusic(){ clearTimeout(melodyTimer); melodyTimer = null; }
    function toggleMusic(){
      musicOn = !musicOn;
      if(musicOn) scheduleMusic(); else stopMusic();
      return musicOn;
    }
    function setVolume(v){
      volume = Math.max(0, Math.min(0.5, v));
      if(masterGain) masterGain.gain.value = volume;
    }
    function getVolume(){ return volume; }

    return {
      ensureCtx,
      startIfNeeded(){ ensureCtx(); if(musicOn && !melodyTimer) scheduleMusic(); },
      sfxJump(){ ensureCtx(); tone(600,0,0.08,'square',0.3); tone(880,0.05,0.1,'square',0.25); },
      sfxCoin(){ ensureCtx(); tone(988,0,0.07,'square',0.3); tone(1318,0.06,0.12,'square',0.3); },
      sfxStomp(){ ensureCtx(); tone(150,0,0.14,'square',0.35); },
      sfxHurt(){ ensureCtx(); tone(300,0,0.1,'sawtooth',0.3); tone(180,0.1,0.22,'sawtooth',0.3); },
      sfxWin(){ ensureCtx(); [523,659,784,1046].forEach((f,i)=>tone(f,i*0.13,0.18,'square',0.3)); },
      sfxLose(){ ensureCtx(); [392,349,311,262].forEach((f,i)=>tone(f,i*0.16,0.22,'sawtooth',0.3)); },
      toggleMusic,
      setVolume,
      getVolume,
      isOn(){ return musicOn; }
    };
  })();

  function resetPlayerPosition(){
    player.x = 40; player.y = GROUND_Y-54; player.vx=0; player.vy=0;
    player.invuln = 60;
    camera.x = 0;
  }

  function takeDamage(){
    if(player.invuln > 0) return;
    lives--;
    document.getElementById('hudLives').textContent = lives;
    AudioEngine.sfxHurt();
    if(lives <= 0){
      levelDone = true;
      finishRun(false);
    } else {
      resetPlayerPosition();
    }
  }

  function updateEnemies(){
    for(const e of level.enemies){
      if(!e.alive) continue;
      e.x += e.vx;
      if(e.x < e.minX){ e.x = e.minX; e.vx = Math.abs(e.vx); }
      if(e.x + e.w > e.maxX){ e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); }
      e.animT = (e.animT||0) + 0.18;

      if(player.invuln <= 0){
        if(rectsOverlap(player, e)){
          const stomp = player.vy > 0 && (player.y + player.h - e.y) < 20;
          if(stomp){
            e.alive = false;
            player.vy = -9.5;
            player.invuln = 20;
            runCoins += 1;
            document.getElementById('hudCoins').textContent = runCoins;
            AudioEngine.sfxStomp();
            spawnCoinPop();
          } else {
            takeDamage();
          }
        }
      }
    }
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  // ---------- ORYGINALNE TEMPO MARIO ----------
  // Klasyczne NES Mario: chód ~1.5 px/klatke w jednostkach gry, bieg szybszy,
  // przyspieszenie/tarcie zamiast natychmiastowej predkosci, skok zmiennej wysokosci.
  const WALK_MAX = 3.7;
  const RUN_MAX = 6.3;
  const ACCEL = 0.42;
  const DECEL_GROUND = 0.42;
  const DECEL_AIR = 0.2;
  const JUMP_VELOCITY = -12.6;
  const JUMP_CUT = 0.45; // puszczenie skoku wczesniej -> nizszy skok

  function update(){
    if(levelDone) return;
    timeAlive++;

    const running = keys['ShiftLeft'] || keys['ShiftRight'];
    const maxSpeed = running ? RUN_MAX : WALK_MAX;

    if(keys['ArrowLeft']||keys['KeyA']){
      player.vx -= ACCEL * (running?1.4:1);
      if(player.vx < -maxSpeed) player.vx = -maxSpeed;
      player.facing = -1;
    } else if(keys['ArrowRight']||keys['KeyD']){
      player.vx += ACCEL * (running?1.4:1);
      if(player.vx > maxSpeed) player.vx = maxSpeed;
      player.facing = 1;
    } else {
      const dec = player.onGround ? DECEL_GROUND : DECEL_AIR;
      if(player.vx > 0){ player.vx -= dec; if(player.vx < 0) player.vx = 0; }
      else if(player.vx < 0){ player.vx += dec; if(player.vx > 0) player.vx = 0; }
    }

    const jumpHeld = keys['Space']||keys['ArrowUp']||keys['KeyW'];
    if(jumpHeld && player.onGround && !player.jumping){
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
      player.jumping = true;
      AudioEngine.sfxJump();
    }
    if(!jumpHeld && player.vy < -JUMP_CUT*6){
      player.vy *= (1-JUMP_CUT*0.3);
    }
    if(player.onGround) player.jumping = false;

    player.vy += GRAVITY;
    if(player.vy > 16) player.vy = 16;

    // ruch poziomy + kolizje
    player.x += player.vx;
    for(const p of [...level.platforms, ...level.pipes]){
      if(rectsOverlap(player,p)){
        if(player.vx > 0){ player.x = p.x - player.w; player.vx = 0; }
        else if(player.vx < 0){ player.x = p.x + p.w; player.vx = 0; }
      }
    }
    if(player.x < 0){ player.x = 0; player.vx = 0; }

    // ruch pionowy + kolizje
    player.y += player.vy;
    player.onGround = false;
    for(const p of [...level.platforms, ...level.pipes]){
      if(rectsOverlap(player,p)){
        if(player.vy > 0){
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if(player.vy < 0){
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }

    if(player.invuln > 0) player.invuln--;

    if(player.y > H + 150){
      takeDamage();
      if(levelDone) return;
    }

    updateEnemies();

    for(const c of level.coins){
      if(!c.taken){
        c.t += 0.15;
        const cb = {x:c.x-10,y:c.y-10,w:20,h:20};
        if(rectsOverlap(player, cb)){
          c.taken = true;
          runCoins++;
          document.getElementById('hudCoins').textContent = runCoins;
          spawnCoinPop();
          AudioEngine.sfxCoin();
        }
      }
    }

    if(rectsOverlap(player, level.flag)){
      levelDone = true;
      finishRun(true);
    }

    camera.x = Math.max(0, Math.min(player.x - W/2, level.width - W));
    player.animT += Math.abs(player.vx) * 0.22;
  }

  function finishRun(won){
    state.wallet += runCoins;
    if(won) AudioEngine.sfxWin(); else AudioEngine.sfxLose();
    if(won && currentLevelIndex === state.unlockedLevel && currentLevelIndex < LEVELS.length-1){
      state.unlockedLevel = currentLevelIndex + 1;
    }
    saveProfile();
    setTimeout(() => {
      if(won){
        if(currentLevelIndex < LEVELS.length-1){
          showBanner('POZIOM UKOŃCZONY!\n+' + runCoins + ' monet', () => startLevel(currentLevelIndex+1));
        } else {
          showBanner('UKOŃCZYŁEŚ WSZYSTKIE POZIOMY!\n+' + runCoins + ' monet', () => showScreen('menu'));
        }
      } else {
        showBanner('GAME OVER\n+' + runCoins + ' monet zebranych', () => showScreen('menu'));
      }
    }, 200);
  }

  function spawnCoinPop(){
    const icon = document.querySelector('.hud-coin-icon');
    const rect = icon.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'coin-pop';
    el.textContent = '+1';
    el.style.left = (rect.left + rect.width/2 + 20) + 'px';
    el.style.top = (rect.top - 2) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }

  function showBanner(text, cb){
    const el = document.createElement('div');
    el.className = 'msg-banner';
    el.textContent = text;
    document.getElementById('gameScreen').appendChild(el);
    setTimeout(() => { el.remove(); cb(); }, 1700);
  }

  function drawCharacterSprite(targetCtx, c, bob, airborne){
    const tctx = targetCtx;
    // ---- cien pod stopami ----
    tctx.fillStyle = 'rgba(0,0,0,.22)';
    tctx.beginPath();
    tctx.ellipse(20, 57, 15, 4, 0, 0, Math.PI*2);
    tctx.fill();

    if(airborne){
      // ---- buty (podkurczone, skok) ----
      const shoeGrad = tctx.createRadialGradient(13,44,2,13,46,10);
      shoeGrad.addColorStop(0,'#a9713a'); shoeGrad.addColorStop(1,'#6b4118');
      tctx.fillStyle = shoeGrad;
      tctx.beginPath(); tctx.ellipse(13, 46, 8, 5.5, -0.3, 0, Math.PI*2); tctx.fill();
      tctx.beginPath(); tctx.ellipse(27, 46, 8, 5.5, 0.3, 0, Math.PI*2); tctx.fill();

      // ---- nogi podkurczone ----
      tctx.fillStyle = shade(c.overalls, -18);
      roundRectOn(tctx, 7, 36, 12, 12, 4); tctx.fill();
      roundRectOn(tctx, 21, 36, 12, 12, 4); tctx.fill();
    } else {
      // ---- buty ----
      const shoeGrad = tctx.createRadialGradient(13,50,2,13,52,10);
      shoeGrad.addColorStop(0,'#a9713a'); shoeGrad.addColorStop(1,'#6b4118');
      tctx.fillStyle = shoeGrad;
      tctx.beginPath(); tctx.ellipse(12, 52+bob, 9, 6, 0, 0, Math.PI*2); tctx.fill();
      tctx.beginPath(); tctx.ellipse(28, 52-bob, 9, 6, 0, 0, Math.PI*2); tctx.fill();

      // ---- nogi (overall) ----
      tctx.fillStyle = shade(c.overalls, -18);
      roundRectOn(tctx, 6, 38, 12, 16+bob, 4); tctx.fill();
      roundRectOn(tctx, 22, 38, 12, 16-bob, 4); tctx.fill();
    }

    // ---- tulow / kombinezon ----
    const bodyGrad = tctx.createLinearGradient(4,20,36,44);
    bodyGrad.addColorStop(0, shade(c.overalls, 18));
    bodyGrad.addColorStop(1, shade(c.overalls, -12));
    tctx.fillStyle = bodyGrad;
    roundRectOn(tctx, 4, 22, 32, 22, 8); tctx.fill();

    // szelki
    tctx.fillStyle = shade(c.overalls, -12);
    roundRectOn(tctx, 10, 15, 7, 10, 3); tctx.fill();
    roundRectOn(tctx, 23, 15, 7, 10, 3); tctx.fill();

    // guziki
    tctx.fillStyle = '#ffd23f';
    tctx.beginPath(); tctx.arc(13, 26, 2.6, 0, Math.PI*2); tctx.fill();
    tctx.beginPath(); tctx.arc(27, 26, 2.6, 0, Math.PI*2); tctx.fill();

    if(airborne){
      // ---- rece uniesione w gore (skok) ----
      const sleeveGrad = tctx.createLinearGradient(-4,0,4,20);
      sleeveGrad.addColorStop(0, shade(c.shirt,16));
      sleeveGrad.addColorStop(1, shade(c.shirt,-10));
      tctx.fillStyle = sleeveGrad;
      tctx.save();
      tctx.translate(3, 20); tctx.rotate(-0.55);
      roundRectOn(tctx, -5, -18, 10, 20, 5); tctx.fill();
      tctx.restore();
      tctx.save();
      tctx.translate(37, 20); tctx.rotate(0.55);
      roundRectOn(tctx, -5, -18, 10, 20, 5); tctx.fill();
      tctx.restore();

      // rekawiczki uniesione
      const gloveGrad = tctx.createRadialGradient(1,0,1,1,0,7);
      gloveGrad.addColorStop(0,'#ffffff'); gloveGrad.addColorStop(1,'#d8d8d8');
      tctx.fillStyle = gloveGrad;
      tctx.beginPath(); tctx.arc(-3, -1, 6.5, 0, Math.PI*2); tctx.fill();
      tctx.beginPath(); tctx.arc(43, -1, 6.5, 0, Math.PI*2); tctx.fill();
    } else {
      // ---- rece / rekawy ----
      const sleeveGrad = tctx.createLinearGradient(-4,16,4,34);
      sleeveGrad.addColorStop(0, shade(c.shirt,16));
      sleeveGrad.addColorStop(1, shade(c.shirt,-10));
      tctx.fillStyle = sleeveGrad;
      roundRectOn(tctx, -3, 17, 10, 20, 5); tctx.fill();
      roundRectOn(tctx, 33, 17, 10, 20, 5); tctx.fill();

      // rekawiczki
      const gloveGrad = tctx.createRadialGradient(1,36,1,1,36,7);
      gloveGrad.addColorStop(0,'#ffffff'); gloveGrad.addColorStop(1,'#d8d8d8');
      tctx.fillStyle = gloveGrad;
      tctx.beginPath(); tctx.arc(2, 36-bob*1.5, 6.5, 0, Math.PI*2); tctx.fill();
      tctx.beginPath(); tctx.arc(38, 36+bob*1.5, 6.5, 0, Math.PI*2); tctx.fill();
    }

    // ---- koszula pod szyja ----
    tctx.fillStyle = shade(c.shirt, 6);
    roundRectOn(tctx, 6, 16, 28, 9, 4); tctx.fill();

    // ---- glowa ----
    const headGrad = tctx.createRadialGradient(15,10,2,20,14,16);
    headGrad.addColorStop(0, shade(c.skin, 20));
    headGrad.addColorStop(1, shade(c.skin, -8));
    tctx.fillStyle = headGrad;
    tctx.beginPath(); tctx.ellipse(20, 12, 13, 12, 0, 0, Math.PI*2); tctx.fill();

    // uszy
    tctx.fillStyle = shade(c.skin, -6);
    tctx.beginPath(); tctx.ellipse(8, 13, 3, 4, 0, 0, Math.PI*2); tctx.fill();

    // brwi
    tctx.strokeStyle = '#3a2a1a';
    tctx.lineWidth = 2.2;
    tctx.lineCap = 'round';
    if(airborne){
      tctx.beginPath(); tctx.moveTo(19, 5); tctx.quadraticCurveTo(25, 2, 31, 5); tctx.stroke();
    } else {
      tctx.beginPath(); tctx.moveTo(20, 6); tctx.quadraticCurveTo(25, 4, 30, 6.5); tctx.stroke();
    }

    // oczy (szerzej otwarte w skoku)
    tctx.fillStyle = '#fff';
    tctx.beginPath(); tctx.ellipse(24, airborne?9:10, 3.4, airborne?4.6:3.8, 0, 0, Math.PI*2); tctx.fill();
    tctx.fillStyle = '#2e6bd6';
    tctx.beginPath(); tctx.arc(25, airborne?9.5:10.5, 2, 0, Math.PI*2); tctx.fill();
    tctx.fillStyle = '#111';
    tctx.beginPath(); tctx.arc(25.6, airborne?9.2:10.2, 0.9, 0, Math.PI*2); tctx.fill();

    // nos
    tctx.fillStyle = shade(c.skin, 8);
    tctx.beginPath(); tctx.ellipse(29, 14, 4.2, 3.4, 0, 0, Math.PI*2); tctx.fill();

    // wasy
    tctx.fillStyle = '#3a2a1a';
    tctx.beginPath();
    tctx.moveTo(18, 17);
    tctx.quadraticCurveTo(24, 14, 30, 17.5);
    tctx.quadraticCurveTo(24, 20.5, 18, 17);
    tctx.fill();

    // ---- czapka ----
    const hatGrad = tctx.createLinearGradient(4,-6,34,10);
    hatGrad.addColorStop(0, shade(c.hat, 22));
    hatGrad.addColorStop(1, shade(c.hat, -10));
    tctx.fillStyle = hatGrad;
    roundRectOn(tctx, 5, -5, 28, 13, 7); tctx.fill();
    // daszek
    tctx.fillStyle = shade(c.hat, -14);
    tctx.beginPath();
    tctx.ellipse(11, 8, 9, 3.4, -0.15, 0, Math.PI*2);
    tctx.fill();
    // znaczek na czapce
    tctx.fillStyle = '#fff';
    tctx.beginPath(); tctx.arc(19, 1, 4.6, 0, Math.PI*2); tctx.fill();
  }

  function roundRectOn(tctx, x,y,w,h,r){
    tctx.beginPath();
    tctx.moveTo(x+r,y);
    tctx.arcTo(x+w,y,x+w,y+h,r);
    tctx.arcTo(x+w,y+h,x,y+h,r);
    tctx.arcTo(x,y+h,x,y,r);
    tctx.arcTo(x,y,x+w,y,r);
    tctx.closePath();
  }
  function roundRect(x,y,w,h,r){ roundRectOn(ctx,x,y,w,h,r); }

  function drawPlayer(){
    const c = skinColors();
    const px = player.x - camera.x;
    const py = player.y;
    // sprite zaprojektowany w lokalnym ukladzie: szer ~40, wys ~56 (0,0 = czubek czapki)
    const scale = player.w/40;
    const airborne = !player.onGround;
    const bob = player.onGround ? Math.sin(player.animT)*1.5 : 0;
    ctx.save();
    ctx.translate(px + player.w/2, py);
    ctx.scale(player.facing*scale, scale);
    ctx.translate(-20, 0);
    drawCharacterSprite(ctx, c, bob, airborne);
    ctx.restore();
  }

  function shade(hex, percent){
    const num = parseInt(hex.replace('#',''),16);
    let r = (num>>16) + Math.round(255*percent/100);
    let g = ((num>>8)&0xff) + Math.round(255*percent/100);
    let b = (num&0xff) + Math.round(255*percent/100);
    r = Math.max(0,Math.min(255,r));
    g = Math.max(0,Math.min(255,g));
    b = Math.max(0,Math.min(255,b));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function bgColors(){
    if(level.bg==='night') return {sky1:'#0b1233', sky2:'#1c2a5e', hill:'#152a4a', sun:'#dfe7ff'};
    if(level.bg==='dusk') return {sky1:'#8a4a8f', sky2:'#e0764f', hill:'#3d2352', sun:'#ffdca0'};
    if(level.bg==='volcano') return {sky1:'#3a0e0e', sky2:'#b8451c', hill:'#2a0a0a', sun:'#ff8a3d'};
    if(level.bg==='ice') return {sky1:'#bfe9ff', sky2:'#eaf7ff', hill:'#6fb8d8', sun:'#ffffff'};
    return {sky1:'#5c94fc', sky2:'#a8d8ff', hill:'#3fae4a', sun:'#fff7c2'};
  }

  function drawBackground(){
    const bc = bgColors();
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, bc.sky1);
    grad.addColorStop(1, bc.sky2);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.fillStyle = bc.sun;
    ctx.beginPath(); ctx.arc(W*0.82, H*0.16, 34, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for(let i=0;i<6;i++){
      const cx = ((i*300 - camera.x*0.3) % (level.width+300) + level.width+300) % (level.width+300) - 150;
      drawCloud(cx, H*0.15 + (i%2)*30);
    }
    ctx.fillStyle = bc.hill;
    for(let i=0;i<8;i++){
      const hx = ((i*260 - camera.x*0.5) % (level.width+260) + level.width+260) % (level.width+260) - 130;
      ctx.beginPath();
      ctx.arc(hx, GROUND_Y+30, 90, Math.PI, 0);
      ctx.fill();
    }
  }
  function drawCloud(x,y){
    ctx.beginPath();
    ctx.arc(x,y,18,0,Math.PI*2);
    ctx.arc(x+20,y-8,14,0,Math.PI*2);
    ctx.arc(x+36,y,18,0,Math.PI*2);
    ctx.fill();
  }

  function drawPlatforms(){
    for(const p of level.platforms){
      const x = p.x - camera.x;
      if(x+p.w < 0 || x > W) continue;
      if(p.isGround){
        ctx.fillStyle = '#8a5a2b';
        ctx.fillRect(x, p.y, p.w, H-p.y+10);
        ctx.fillStyle = '#3fae4a';
        ctx.fillRect(x, p.y, p.w, 10);
      } else {
        ctx.fillStyle = '#c96a2e';
        ctx.fillRect(x, p.y, p.w, p.h);
        ctx.strokeStyle = '#7a3d15';
        ctx.lineWidth = 2;
        for(let bx=0; bx<p.w; bx+=22) ctx.strokeRect(x+bx, p.y, 22, p.h);
      }
    }
    for(const p of level.pipes){
      const x = p.x - camera.x;
      if(x+p.w < 0 || x > W) continue;
      ctx.fillStyle = '#1e9e46';
      ctx.fillRect(x, p.y, p.w, p.h);
      ctx.fillStyle = '#2ecc57';
      ctx.fillRect(x-4, p.y, p.w+8, 12);
    }
  }

  function drawCoins(){
    for(const c of level.coins){
      if(c.taken) continue;
      const x = c.x - camera.x;
      if(x < -20 || x > W+20) continue;
      const squish = Math.abs(Math.cos(c.t));
      ctx.save();
      ctx.translate(x, c.y);
      ctx.scale(squish*0.9+0.15, 1);
      const grad = ctx.createRadialGradient(-3,-3,1,0,0,10);
      grad.addColorStop(0,'#fff6c9');
      grad.addColorStop(0.5,'#ffd23f');
      grad.addColorStop(1,'#c8860a');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#8a5a00';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawFlag(){
    const x = level.flag.x - camera.x;
    ctx.fillStyle = '#ccc';
    ctx.fillRect(x, level.flag.y, 6, level.flag.h);
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(x+6, level.flag.y+6);
    ctx.lineTo(x+34, level.flag.y+16);
    ctx.lineTo(x+6, level.flag.y+26);
    ctx.fill();
  }

  function drawEnemies(){
    for(const e of level.enemies){
      if(!e.alive) continue;
      const x = e.x - camera.x;
      if(x+e.w < 0 || x > W) continue;
      const walkBob = Math.sin(e.animT||0) * 2.2;
      const squash = 1 + Math.sin((e.animT||0)*2) * 0.03;
      const cx = x + e.w/2, cy = e.y + e.h/2 + walkBob*0.4;
      const bodyW = (e.w/2) * squash;
      const bodyH = (e.h/2) / squash;
      const facing = e.vx >= 0 ? 1 : -1;

      // cien pod nim
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse(cx, e.y+e.h+5, e.w/2, 4.5, 0, 0, Math.PI*2); ctx.fill();

      // nozki (przebieranie)
      const stepA = Math.sin(e.animT||0);
      ctx.fillStyle = '#4a1f66';
      ctx.beginPath(); ctx.ellipse(cx-9, e.y+e.h-3+stepA*2, 6.5, 4.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+9, e.y+e.h-3-stepA*2, 6.5, 4.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#2c1140';
      ctx.beginPath(); ctx.ellipse(cx-9, e.y+e.h+stepA*2, 5, 2.6, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+9, e.y+e.h-stepA*2, 5, 2.6, 0, 0, Math.PI*2); ctx.fill();

      // grzbiet kolcow
      ctx.fillStyle = '#4a1f66';
      for(let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.moveTo(cx+i*7-4, cy-bodyH*0.75);
        ctx.lineTo(cx+i*7, cy-bodyH*1.15);
        ctx.lineTo(cx+i*7+4, cy-bodyH*0.75);
        ctx.fill();
      }

      // cialo - gradient dajacy objetosc
      const grad = ctx.createRadialGradient(cx-bodyW*0.35, cy-bodyH*0.4, 2, cx, cy, bodyW*1.15);
      grad.addColorStop(0, '#d69bf0');
      grad.addColorStop(0.45, '#a655d6');
      grad.addColorStop(1, '#5e2680');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(cx, cy, bodyW, bodyH, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#3a1554';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // jasny brzuch
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      ctx.beginPath(); ctx.ellipse(cx, cy+bodyH*0.35, bodyW*0.6, bodyH*0.45, 0, 0, Math.PI*2); ctx.fill();

      // cetki
      ctx.fillStyle = 'rgba(60,20,80,.35)';
      ctx.beginPath(); ctx.ellipse(cx-bodyW*0.5, cy+bodyH*0.1, 3, 2.4, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+bodyW*0.4, cy-bodyH*0.25, 2.6, 2, 0, 0, Math.PI*2); ctx.fill();

      // brwi wkurzone (zwrocone w strone ruchu)
      ctx.strokeStyle = '#2c1440';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      const browShift = facing*2;
      ctx.beginPath(); ctx.moveTo(cx-11+browShift, cy-bodyH*0.55); ctx.lineTo(cx-3+browShift, cy-bodyH*0.15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+11+browShift, cy-bodyH*0.55); ctx.lineTo(cx+3+browShift, cy-bodyH*0.15); ctx.stroke();

      // oczy (patrzace w strone ruchu)
      const eyeShift = facing*1.5;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(cx-6+eyeShift, cy+bodyH*0.05, 4.3, 5.2, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+6+eyeShift, cy+bodyH*0.05, 4.3, 5.2, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff3b3b';
      ctx.beginPath(); ctx.arc(cx-6+eyeShift*1.6, cy+bodyH*0.08, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+6+eyeShift*1.6, cy+bodyH*0.08, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1a0d28';
      ctx.beginPath(); ctx.arc(cx-6+eyeShift*1.6, cy+bodyH*0.08, 0.9, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+6+eyeShift*1.6, cy+bodyH*0.08, 0.9, 0, Math.PI*2); ctx.fill();

      // zabawne zebki
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(cx-5, cy+bodyH*0.55);
      ctx.lineTo(cx-2, cy+bodyH*0.42);
      ctx.lineTo(cx+1, cy+bodyH*0.55);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx+2, cy+bodyH*0.55);
      ctx.lineTo(cx+5, cy+bodyH*0.42);
      ctx.lineTo(cx+8, cy+bodyH*0.55);
      ctx.fill();
    }
  }

  function draw(){
    drawBackground();
    drawPlatforms();
    drawCoins();
    drawEnemies();
    drawFlag();
    drawPlayer();
  }

  function loop(){
    update();
    draw();
    if(!levelDone){
      rafId = requestAnimationFrame(loop);
    } else {
      cancelAnimationFrame(rafId);
    }
  }

  // init
  resizeCanvas();
  updateAuthUI();
  showScreen('menu');
  volumeSlider.value = Math.round(AudioEngine.getVolume() / 0.5 * 100);
  volumeValue.textContent = volumeSlider.value + '%';

  if(sb){
    sb.auth.getSession().then(({data}) => {
      if(data.session){
        currentUser = data.session.user;
        loadProfile(currentUser).then(() => { updateAuthUI(); showScreen('menu'); });
      }
    });
    sb.auth.onAuthStateChange((_event, session) => {
      currentUser = session ? session.user : null;
      if(currentUser){
        loadProfile(currentUser).then(() => { updateAuthUI(); showScreen('menu'); });
      } else {
        updateAuthUI();
      }
    });
  }
})();
</script>
</body>
</html>
